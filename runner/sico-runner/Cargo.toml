[package]
name = "sico-runner"
description = "In-process Script runner for sico:script/program@0.1.0 Components"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[dependencies]
ctrlc = "=3.5.2"
sico-codegen-wasm = { path = "../../crates/sico-codegen-wasm" }
sico-http-provider = { path = "../../crates/sico-http-provider" }
sico-observability = { path = "../../crates/sico-observability" }
sico-tooling-protocol = { path = "../../crates/sico-tooling-protocol" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
wasmtime = { version = "=47.0.2", default-features = false, features = ["anyhow", "component-model", "cranelift", "debug", "runtime", "std"] }
wasmparser = "=0.253.0"

[dev-dependencies]
sico-package = { path = "../../crates/sico-package" }
sico-app-cli = { path = "../../crates/sico-app-cli" }
sico-cli = { path = "../../crates/sico-cli" }
sico-format = { path = "../../crates/sico-format" }
sico-ir = { path = "../../crates/sico-ir" }
sico-lexer = { path = "../../crates/sico-lexer" }
sico-parser = { path = "../../crates/sico-parser" }
sico-source = { path = "../../crates/sico-source" }
wasm-encoder = "=0.253.0"

[workspace]

# STEP-0317 validation economics: the differential suites spend their wall
# time inside wasmtime/cranelift and the in-process `sico build` of the
# selfhost sources, all of which are dependencies of this crate. Debug
# codegen there dominates guest execution cost; opt-level 1 on every
# non-member dependency trades a one-time slower build for substantially
# faster test execution. Workspace members keep debug codegen so test-file
# iteration rebuilds stay fast.
[profile.dev.package."*"]
opt-level = 1

[lints.rust]
unsafe_code = "forbid"
