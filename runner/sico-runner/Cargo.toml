[package]
name = "sico-runner"
description = "In-process Script runner for sico:script/program@0.1.0 Components"
version = "0.0.2-dev"
edition = "2024"
rust-version = "1.97"
publish = false

[dependencies]
sico-codegen-wasm = { path = "../../crates/sico-codegen-wasm" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
wasmtime = { version = "=46.0.1", default-features = false, features = ["anyhow", "component-model", "cranelift", "runtime", "std"] }

[dev-dependencies]
sico-app-cli = { path = "../../crates/sico-app-cli" }
sico-ir = { path = "../../crates/sico-ir" }
wasm-encoder = "=0.253.0"

[workspace]

[lints.rust]
unsafe_code = "forbid"
