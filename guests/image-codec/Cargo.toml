[package]
name = "sico-image-codec-guest"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
png = "=0.18.1"

# ADR-0019 §2: release profile fixed for byte-reproducible core production.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = 0
strip = true
