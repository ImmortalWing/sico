[workspace]
members = [
    "crates/sico-cli",
    "crates/sico-diagnostics",
    "crates/sico-format",
    "crates/sico-hir",
    "crates/sico-lexer",
    "crates/sico-parser",
    "crates/sico-semantics",
    "crates/sico-source",
    "crates/sico-syntax",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
clap = { version = "=4.6.1", default-features = false, features = ["error-context", "help", "std", "suggestions", "usage"] }
rowan = "=0.16.1"
serde_json = "=1.0.150"
text-size = "=1.1.1"
unicode-ident = "=1.0.24"
unicode-normalization = "=0.1.25"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
