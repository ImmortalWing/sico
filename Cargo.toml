[workspace]
members = [
    "crates/sico-app-cli",
    "crates/sico-cli",
    "crates/sico-ai-tools",
    "crates/sico-codegen-wasm",
    "crates/sico-diagnostics",
    "crates/sico-desktop-host",
    "crates/sico-ecosystem",
    "crates/sico-format",
    "crates/sico-hir",
    "crates/sico-host-core",
    "crates/sico-index",
    "crates/sico-ir",
    "crates/sico-lexer",
    "crates/sico-language-server",
    "crates/sico-mobile-host-core",
    "crates/sico-parser",
    "crates/sico-package",
    "crates/sico-runtime",
    "crates/sico-semantics",
    "crates/sico-source",
    "crates/sico-syntax",
    "pilots/third-party-component",
]
resolver = "3"
exclude = [
    "prototypes/component-host-call/async-guest",
    "prototypes/component-host-call/guest",
    "prototypes/component-host-call/host",
    "prototypes/numeric",
    "prototypes/resource-async",
]

[workspace.package]
version = "0.0.2-dev"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
clap = { version = "=4.6.1", default-features = false, features = ["error-context", "help", "std", "suggestions", "usage"] }
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["fast", "zeroize"] }
rowan = "=0.16.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
text-size = "=1.1.1"
unicode-ident = "=1.0.24"
unicode-normalization = "=0.1.25"
wasm-encoder = "=0.253.0"
wasmparser = "=0.253.0"
wit-parser = "=0.253.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
