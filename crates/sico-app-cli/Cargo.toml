[package]
name = "sico-app-cli"
description = "Application packaging and Runtime launcher for Sico Components"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "sico-app"
path = "src/main.rs"

[dependencies]
clap.workspace = true
serde_json.workspace = true
sico-package = { path = "../sico-package" }
sico-runtime = { path = "../sico-runtime" }

[dev-dependencies]
sico-codegen-wasm = { path = "../sico-codegen-wasm" }
sico-ir = { path = "../sico-ir" }
sico-source = { path = "../sico-source" }

[lints]
workspace = true
