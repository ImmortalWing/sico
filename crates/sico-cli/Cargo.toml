[package]
name = "sico-cli"
description = "Command-line integration boundary for the Sico toolchain"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "sico"
path = "src/main.rs"

[dependencies]
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
sico-diagnostics = { path = "../sico-diagnostics" }
sico-format = { path = "../sico-format" }
sico-lexer = { path = "../sico-lexer" }
sico-parser = { path = "../sico-parser" }
sico-codegen-wasm = { path = "../sico-codegen-wasm" }
sico-ir = { path = "../sico-ir" }
sico-semantics = { path = "../sico-semantics" }
sico-source = { path = "../sico-source" }
sico-syntax = { path = "../sico-syntax" }
sha2.workspace = true
sico-package = { path = "../sico-package" }
wasmparser.workspace = true

[dev-dependencies]
sico-observability = { path = "../sico-observability" }

[lints]
workspace = true
