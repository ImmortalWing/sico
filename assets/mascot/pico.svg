<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Pico — Sico mascot (woodpecker)</title>
  <!-- Palette: steel #2E7C8A, dark teal #1E5761, red #E5484D, cream #F6EFDD, slate #333F46, amber #F2B33D -->
  <!-- component block -->
  <polygon points="44,38 54.4,44 54.4,56 44,62 33.6,56 33.6,44" fill="#F2B33D"/>
  <!-- tail -->
  <polygon points="37,33 49,42 43,47" fill="#1E5761"/>
  <!-- body -->
  <ellipse cx="33" cy="30" rx="9.5" ry="12.5" fill="#2E7C8A" transform="rotate(-10 33 30)"/>
  <!-- belly -->
  <ellipse cx="29.5" cy="33" rx="5" ry="8" fill="#F6EFDD" transform="rotate(-10 29.5 33)"/>
  <!-- wing -->
  <ellipse cx="35.5" cy="29.5" rx="4" ry="6.5" fill="#1E5761" transform="rotate(-18 35.5 29.5)"/>
  <!-- head -->
  <circle cx="27" cy="16" r="8.5" fill="#2E7C8A"/>
  <!-- crest -->
  <polygon points="26,8 33.5,2 34,12" fill="#E5484D"/>
  <!-- beak -->
  <polygon points="20,13.5 20,19.5 3,16.5" fill="#333F46"/>
  <!-- eye -->
  <circle cx="24.5" cy="13.5" r="2.3" fill="#FFFFFF"/>
  <circle cx="24.5" cy="13.5" r="1.1" fill="#1A2B30"/>
  <!-- feet -->
  <polygon points="34.5,41 37.5,41 36,45" fill="#333F46"/>
  <polygon points="39.5,42 42.5,42 41,46" fill="#333F46"/>
</svg>
