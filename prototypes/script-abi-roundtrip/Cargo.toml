[package]
name = "sico-script-abi-roundtrip"
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
publish = false

[dependencies]
sico-codegen-wasm = { path = "../../crates/sico-codegen-wasm" }
sico-ir = { path = "../../crates/sico-ir" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
wasm-encoder = "=0.253.0"
wasmparser = "=0.253.0"
wasmtime = { version = "=46.0.1", default-features = false, features = ["anyhow", "component-model", "cranelift", "runtime", "std"] }

[workspace]

[lints.rust]
unsafe_code = "forbid"
