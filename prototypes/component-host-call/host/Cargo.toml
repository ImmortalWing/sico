[package]
name = "sico-component-host"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "=1.0.102"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
futures = "=0.3.32"
wasmtime = { version = "=46.0.1", default-features = false, features = ["async", "component-model", "component-model-async", "cranelift", "runtime", "std"] }
wit-component = "=0.253.0"
wat = "=1.251.0"

[[bin]]
name = "sico-component-host"
path = "src/main.rs"

[[bin]]
name = "sico-component-async-host"
path = "src/bin/async_host.rs"

[[bin]]
name = "sico-future-stream-probe"
path = "src/bin/future_stream_probe.rs"
