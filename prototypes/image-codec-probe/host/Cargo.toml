[package]
name = "sico-image-codec-probe-host"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "codec-probe"
path = "src/main.rs"

[dependencies]
sico-codegen-wasm = { path = "../../../crates/sico-codegen-wasm" }
sico-ir = { path = "../../../crates/sico-ir" }
sha2 = "=0.10.9"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
wasmtime = { version = "=47.0.2", default-features = false, features = ["anyhow", "component-model", "cranelift", "runtime", "std"] }

[profile.release]
opt-level = 2
